version: '3.8'

services:
  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    ports:
      - "3001:80"
    env_file:
      - ./frontend/.env
    environment:
      - GENERATE_SOURCEMAP=false
      - DISABLE_ESLINT_PLUGIN=true
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # Backend Node.js API
  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    environment:
      - LOG_LEVEL=debug
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      - chromadb
    networks:
      - app-network
    restart: unless-stopped

  # ChromaDB Vector Database
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - ALLOW_RESET=true
      - ANONYMIZED_TELEMETRY=false
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  chroma-data:
    driver: local